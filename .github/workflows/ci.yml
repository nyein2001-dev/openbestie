name: Open Bestie
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run migrate:local
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
  production:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    concurrency:
      group: openbestie-production
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PUBLIC_URL: ${{ vars.PUBLIC_URL }}
      SELLER_NAME: ${{ vars.SELLER_NAME }}
      SUPPORT_EMAIL: ${{ vars.SUPPORT_EMAIL }}
      GUMROAD_HOST: ${{ vars.GUMROAD_HOST }}
      ADMIN_HOST: ${{ vars.ADMIN_HOST }}
      ACCESS_ISSUER: ${{ vars.ACCESS_ISSUER }}
      ACCESS_AUDIENCE: ${{ vars.ACCESS_AUDIENCE }}
      OWNER_EMAIL: ${{ secrets.OWNER_EMAIL }}
      PLAUSIBLE_SCRIPT_URL: ${{ vars.PLAUSIBLE_SCRIPT_URL }}
      D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
      R2_BUCKET: ${{ vars.R2_BUCKET }}
    steps:
      - id: access
        shell: bash
        run: |
          if [[ -n "$CLOUDFLARE_API_TOKEN" && -n "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Skipping production deploy because Cloudflare credentials are unconfigured."
          fi
      - if: steps.access.outputs.ready == 'true'
        uses: actions/checkout@v7
      - if: steps.access.outputs.ready == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - if: steps.access.outputs.ready == 'true'
        run: npm ci
      - if: steps.access.outputs.ready == 'true'
        run: npm run deploy:production
